<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notes Management System</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="section-label">Notes</p>
        <h1>Notes Management System</h1>
      </div>
      <button class="primary-action" id="newNoteButton" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        New Note
      </button>
    </header>

    <main class="app-shell">
      <section class="notes-panel" aria-label="Saved notes">
        <div class="search-box">
          <label class="visually-hidden" for="searchInput">Search notes</label>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="Search notes" autocomplete="off">
        </div>

        <div class="list-toolbar">
          <span id="notesCount">0 notes</span>
          <button class="icon-button" id="refreshButton" type="button" title="Refresh notes" aria-label="Refresh notes">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"></path>
            </svg>
          </button>
        </div>

        <p class="status-message" id="listStatus" role="status"></p>
        <ul class="notes-list" id="notesList"></ul>
      </section>

      <section class="editor-panel" aria-label="Note editor">
        <form id="noteForm" novalidate>
          <input id="noteId" type="hidden">

          <div class="editor-toolbar">
            <div>
              <p class="section-label" id="editorMode">New note</p>
              <h2 id="editorTitle">Create a note</h2>
            </div>
            <button class="icon-button danger" id="deleteButton" type="button" title="Delete note" aria-label="Delete note" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 11v5M14 11v5"></path>
              </svg>
            </button>
          </div>

          <div class="field-group">
            <label for="titleInput">Title</label>
            <input id="titleInput" name="title" type="text" maxlength="120" autocomplete="off" required>
          </div>

          <div class="field-group">
            <label for="contentInput">Content</label>
            <textarea id="contentInput" name="content" rows="13"></textarea>
          </div>

          <div class="note-meta" id="noteMeta" hidden></div>
          <p class="form-error" id="formError" role="alert"></p>

          <div class="form-actions">
            <button class="secondary-action" id="clearButton" type="button">Clear</button>
            <button class="primary-action" id="saveButton" type="submit">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
                <path d="M17 21v-8H7v8M7 3v5h8"></path>
              </svg>
              Save Note
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
