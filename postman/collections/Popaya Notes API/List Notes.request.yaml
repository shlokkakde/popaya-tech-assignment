$kind: http-request
url: "{{baseUrl}}/api/notes"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('notes list returns an array', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data).to.be.an('array');
      });
    language: text/javascript
order: 3000
