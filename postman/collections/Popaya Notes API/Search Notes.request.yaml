$kind: http-request
url: "{{baseUrl}}/api/notes?search=verification"
method: GET
queryParams:
  search: verification
scripts:
  - type: afterResponse
    code: |-
      pm.test('search returns matching notes', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data.length).to.be.greaterThan(0);
      });
    language: text/javascript
order: 5000
