$kind: http-request
url: "{{baseUrl}}/api/notes/{{noteId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Updated Postman note",
      "content": "Updated from Postman after deployment."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('note is updated', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data.title).to.eql('Updated Postman note');
      });
    language: text/javascript
order: 6000
